<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232f3e">
<title>AWS CLF 問題集</title>
<!-- PWA（ホーム画面に置いてオフラインで使う） -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLF問題集">
<!-- クラウド同期（Supabase）。オフライン時は読み込めず、その時はローカルのみで動作 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --aws:#ff9900; --navy:#232f3e; --navy2:#2e3b4e;
    --ok:#1f9d55; --ng:#e0245e; --bg:#f4f5f7; --card:#fff;
    --line:#e2e5ea; --muted:#6b7280; --text:#1c2330;
    --okbg:#eafaf0; --okbd:#bce8cd; --ngbg:#fdeaf0; --ngbd:#f5c2d3;
    --choicebg:#fff; --secbtn:#eceef2; --bar:#eceef2; --tagbg:#eef1f5;
  }
  html[data-theme="light"]{ color-scheme: light }
  /* color-scheme を宣言しないと、select のドロップダウンや入力欄の枠など
     ブラウザが描く部分だけ明るいままになり、ダークモードで浮いて見える。 */
  html[data-theme="dark"]{
    color-scheme: dark;
    --navy:#0e1620; --bg:#0f141b; --card:#1a2230;
    --line:#2b3545; --muted:#9aa6b5; --text:#e8ecf2;
    --ok:#34c77b; --ng:#ff5c86;
    --okbg:#13301f; --okbd:#1f5d3a; --ngbg:#371320; --ngbd:#7a2540;
    --choicebg:#222c3c; --secbtn:#28323f; --bar:#28323f; --tagbg:#28323f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:var(--navy); color:#fff; padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:8px;
  }
  header .logo{color:var(--aws); font-weight:800; font-size:18px}
  header .sub{font-size:12px; opacity:.8; margin-left:auto}
  main{max-width:640px; margin:0 auto; padding:16px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
  h2{font-size:17px; margin:0 0 10px}
  p.muted{color:var(--muted); font-size:13px; margin:6px 0}
  .big{font-size:40px; font-weight:800; line-height:1.1}
  button{font-family:inherit; cursor:pointer}
  .btn{
    display:block; width:100%; border:none; border-radius:12px; padding:15px;
    font-size:16px; font-weight:700; background:var(--aws); color:#1c1c1c; margin-top:8px;
  }
  .btn.secondary{background:var(--secbtn); color:var(--text)}
  .btn:disabled{opacity:.45}
  .choice{
    display:block; width:100%; text-align:left; background:var(--choicebg); border:2px solid var(--line);
    border-radius:12px; padding:14px; font-size:15.5px; margin-top:10px; color:var(--text);
  }
  .choice:active{transform:scale(.995)}
  .choice.correct{border-color:var(--ok); background:var(--okbg)}
  .choice.wrong{border-color:var(--ng); background:var(--ngbg)}
  .choice .mark{font-weight:800; margin-right:6px}
  .tag{display:inline-block; font-size:11px; background:var(--tagbg); color:var(--muted); border-radius:999px; padding:3px 9px; margin:2px 4px 2px 0}
  .feedback{margin-top:14px; padding:13px; border-radius:12px; font-size:14.5px}
  .feedback.ok{background:var(--okbg); border:1px solid var(--okbd)}
  .feedback.ng{background:var(--ngbg); border:1px solid var(--ngbd)}
  .feedback h3{margin:0 0 6px; font-size:14px}
  /* ログイン欄のemail/passwordや分野セレクトも同じ見た目にそろえる
     （type=textだけを指定していた頃は、ここだけ素のブラウザ表示になっていた） */
  textarea,input[type=text],input[type=email],input[type=password],select{
    width:100%; font-family:inherit; font-size:16px; border:2px solid var(--line);
    border-radius:10px; padding:11px; resize:vertical; background:var(--choicebg); color:var(--text);
  }
  select{padding:10px; resize:none}
  .row{display:flex; gap:8px}
  .row .btn{margin-top:0}
  nav{
    position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; max-width:640px; margin:0 auto; padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{flex:1; background:none; border:none; padding:10px 4px 12px; font-size:11px; color:var(--muted)}
  nav button .ic{display:block; font-size:20px; line-height:1.2}
  nav button.active{color:var(--aws); font-weight:800}
  /* ヘッダーのテーマ切替＆クイズ中断ボタン */
  .iconbtn{background:rgba(255,255,255,.14); border:none; color:#fff; font-size:16px;
    width:34px; height:34px; border-radius:50%; line-height:1; cursor:pointer}
  .quit-row{display:flex; justify-content:flex-end; margin-bottom:2px}
  .quit-btn{background:none; border:1px solid var(--line); color:var(--muted);
    font-size:13px; padding:6px 12px; border-radius:999px; cursor:pointer}
  .bar{height:10px; background:var(--bar); border-radius:999px; overflow:hidden; margin:4px 0 2px}
  .bar > i{display:block; height:100%; background:var(--aws)}
  .stat-line{display:flex; justify-content:space-between; font-size:13px; margin-top:10px}
  .pill{font-size:12px; padding:2px 8px; border-radius:999px; background:var(--navy); color:#fff}
  .list-item{border-top:1px solid var(--line); padding:10px 0; font-size:14px}
  .list-item:first-child{border-top:none}
  .hint{font-size:12.5px; color:var(--muted)}
  .center{text-align:center}
  details{font-size:13px; color:var(--muted); margin-top:8px}
  .progress-dots{font-size:12px; color:var(--muted); margin-bottom:6px}
</style>
</head>
<body>
<header>
  <span class="logo">AWS</span>
  <span style="font-weight:700">CLF 問題集</span>
  <span class="sub" id="hdrSub"></span>
  <button class="iconbtn" id="themeBtn" title="ダーク/ライト切替" onclick="toggleTheme()">🌙</button>
</header>

<main id="app"></main>

<nav>
  <button data-view="home" class="active"><span class="ic">📚</span>今日やる</button>
  <button data-view="zukan"><span class="ic">📖</span>図鑑</button>
  <button data-view="stats"><span class="ic">📊</span>成績</button>
  <button data-view="settings"><span class="ic">⚙️</span>設定</button>
</nav>

<script>
"use strict";

/* ===== 保存キー ===== */
const K_Q = "awsq_questions_v1";     // 問題データ
const K_P = "awsq_progress_v1";      // 学習進捗（SM-2）
const K_T = "awsq_theme_v1";         // テーマ（light / dark）
const K_B = "awsq_batch_v1";         // 1回の出題数（0=全部）
const K_F = "awsq_secfilter_v1";     // 分野しぼり込み（""=すべて）。UI設定なのでクラウド同期しない

/* ===== 1回の出題数（通勤で区切る） ===== */
function getBatch(){
  const v = parseInt(localStorage.getItem(K_B), 10);
  return isNaN(v) ? 10 : v;   // 既定10問
}
function setBatch(n){ localStorage.setItem(K_B, String(n)); render(); }

/* ===== 分野しぼり込み（SM-2はそのまま、出題対象の母集団を絞るだけ） =====
   section の「7-3」等の番号をキーにする。データから自動生成するので、章を足せばメニューも自動で増える。 */
function getFilter(){ return localStorage.getItem(K_F) || ""; }
function setFilter(k){
  if(k) localStorage.setItem(K_F, k); else localStorage.removeItem(K_F);
  render();
}
function secKey(q){
  const s = (q.section || "").trim();
  let m = s.match(/^(\d+-\d+)/);          if(m) return m[1];        // 例: 7-3
  m = s.match(/^第(\d+)章/);               if(m) return "ch"+m[1];   // 例: 第5章 → ch5
  return "other";
}
function secBase(q){   // 番号と（補足）を取り除いた話題名。例: "7-3 Amazon S3（容量）" → "Amazon S3"
  let s = (q.section || "").trim().replace(/（.*?）\s*$/,"").replace(/\(.*?\)\s*$/,"");
  s = s.replace(/^\s*\d+-\d+\s*/,"").replace(/^第\d+章\s*/,"");
  return s || "その他";
}
function sectionGroups(){   // [{key, label, n}] をキー順で返す
  const map = {};
  questions.forEach(q=>{
    const k = secKey(q);
    if(!map[k]) map[k] = { key:k, bases:[], n:0 };
    map[k].n++;
    const b = secBase(q);
    if(map[k].bases.indexOf(b) < 0) map[k].bases.push(b);
  });
  return Object.values(map).map(g=>{
    let topics = g.bases.slice(0,2).join("・");
    if(g.bases.length > 2) topics += "ほか";
    const prefix = /^\d/.test(g.key) ? g.key+" " : "";
    return { key:g.key, label:prefix+topics, n:g.n };
  }).sort((a,b)=>a.key.localeCompare(b.key, "ja", {numeric:true}));
}
function applyFilter(arr){
  const f = getFilter();
  return f ? arr.filter(q=>secKey(q)===f) : arr;
}

/* ===== テーマ（ダークモード） ===== */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = (t === "dark") ? "☀️" : "🌙";
  // ホーム画面から起動したときのステータスバー色もヘッダーに合わせる
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", (t === "dark") ? "#0e1620" : "#232f3e");
}
function initTheme(){
  let t = localStorage.getItem(K_T);
  if(!t){ // 初回は端末の設定に従う
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  applyTheme(t);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const next = (cur === "dark") ? "light" : "dark";
  localStorage.setItem(K_T, next);
  applyTheme(next);
}

/* ===== ドメイン（CLF-C02 4分野） ===== */
const DOMAINS = [
  "クラウドの概念",
  "セキュリティとコンプライアンス",
  "クラウドのテクノロジーとサービス",
  "請求・料金・サポート"
];

/* ===== 状態 ===== */
let questions = [];
let terms = [];                    // 用語図鑑
const K_TERMS = "awsq_terms_v1";
let progress = {};   // id -> {ef, interval, due, reps, lapses, seen, correctCount, wrongCount, lastQuality}
let view = "home";
let session = null;  // 出題中セッション
let zukanQuery = "";               // 図鑑の検索語
let zukanTerm = null;              // 図鑑で開いている用語名（null=一覧）

/* ===== ユーティリティ ===== */
const $ = sel => document.querySelector(sel);
// 日付はローカル時刻基準で扱う（UTCのtoISOStringだとJSTで1日ずれるため）
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayStr = () => ymd(new Date());
const addDays = (dateStr, n) => {
  const [y,m,dd] = dateStr.split("-").map(Number);
  const d = new Date(y, m-1, dd);
  d.setDate(d.getDate() + n);
  return ymd(d);
};
// updatedAt(ISO)から「今日/1日前/n日前」を出す。ISOがなければ日付部分だけの旧データにも対応。
function daysAgoLabel(isoOrDate){
  if(!isoOrDate) return "";
  // ISO(UTC)文字列はローカル日付に変換してから比較する（UTCのままだとJSTで日付がずれるため）
  const thenLocal = new Date(isoOrDate);
  const then = new Date(thenLocal.getFullYear(), thenLocal.getMonth(), thenLocal.getDate());
  const [ty,tm,td] = todayStr().split("-").map(Number);
  const now = new Date(ty, tm-1, td);
  const diff = Math.round((now - then) / 86400000);
  if(diff <= 0) return "今日";
  if(diff === 1) return "1日前";
  return `${diff}日前`;
}
// ' も変換する。用語名などを onclick='...' の中に埋めているため、
// アポストロフィを含む文字列が来ると属性が途中で閉じて画面が壊れるのを防ぐ。
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// onclick 属性の中へ文字列リテラルとして埋め込む用（JSON化してからHTMLエスケープ）
const jsArg = v => esc(JSON.stringify(v));

function load(){
  try{ questions = JSON.parse(localStorage.getItem(K_Q)) || []; }catch(e){ questions = []; }
  try{ terms = JSON.parse(localStorage.getItem(K_TERMS)) || []; }catch(e){ terms = []; }
  try{ progress = JSON.parse(localStorage.getItem(K_P)) || {}; }catch(e){ progress = {}; }
}
function saveProgress(){ localStorage.setItem(K_P, JSON.stringify(progress)); }
function saveQuestions(){ localStorage.setItem(K_Q, JSON.stringify(questions)); }
function saveTerms(){ localStorage.setItem(K_TERMS, JSON.stringify(terms)); }

/* JSON（questions.json / バックアップ / 貼り付け）を1つの入口で取り込む。
   起動時の自動取り込み・「最新を取り込む」・設定からの読み込みで同じ処理を使う。
   問題はid、用語はtermをキーに上書きマージする（消しはしない）。
   返り値: {q, t, p} 取り込んだ件数 */
function mergeData(d){
  if(!d || typeof d !== "object") throw new Error("JSONの形式が正しくありません");
  const qarr = Array.isArray(d) ? d : (d.questions || []);
  const tarr = Array.isArray(d.terms) ? d.terms : [];
  const parr = (d.progress && typeof d.progress === "object") ? d.progress : null;

  if(qarr.length){
    const m = {}; questions.forEach(q => m[q.id] = q);
    qarr.forEach(q => { if(q.id) m[q.id] = q; });
    questions = Object.values(m); saveQuestions();
  }
  if(tarr.length){
    const m = {}; terms.forEach(t => m[t.term] = t);
    tarr.forEach(t => { if(t.term) m[t.term] = t; });
    terms = Object.values(m); saveTerms();
  }
  // 学習記録つきのバックアップなら進捗も戻す。updatedAtが新しい方を残すので
  // 「バックアップを読んだら今日の学習が巻き戻る」ことはない。
  let pCount = 0;
  if(parr){
    Object.keys(parr).forEach(id => {
      const inc = parr[id];
      if(!inc || typeof inc !== "object") return;
      const cur = progress[id];
      if(!cur || (inc.updatedAt || "") > (cur.updatedAt || "")){ progress[id] = inc; pCount++; }
    });
    if(pCount) saveProgress();
  }
  return { q: qarr.length, t: tarr.length, p: pCount };
}

/* ===== クラウド同期（Supabase・任意ログイン） =====
   方針: ローカル(localStorage)が常に手元の正。ログイン中かつ電波がある時だけ、
   問題はクラウドから取得、進捗は updated_at で新しい方を採用して双方向に揃える。 */
const SB_URL = "https://icxbyltorjpfexmwxzga.supabase.co";
const SB_KEY = "sb_publishable_6qgfCo_xbhbjb3Lr__j-Yg_Y7Zk2yWH";
let supa = null;
try{
  if(window.supabase) supa = window.supabase.createClient(SB_URL, SB_KEY, {
    // このアプリ専用のログイン保存キー。同じfoggydock.github.io上の他アプリ（歴史ログ等）と
    // ログインを共有しないよう独立させる。
    auth: { storageKey: "awsq-auth", persistSession: true, autoRefreshToken: true }
  });
}catch(e){ supa = null; }
let currentUser = null;
let syncing = false;
let syncAgain = false;   // 同期中に来た呼び出しを1回分だけ覚えておく（下の syncAll 参照）
let syncStatus = "";
function cloudReady(){ return !!(supa && currentUser); }
function setSyncStatus(s){ syncStatus = s; const el = document.getElementById("syncStatus"); if(el) el.textContent = s; }

function progToRow(id){
  const p = progress[id];
  return { user_id: currentUser.id, question_id: id, ef: p.ef, interval: p.interval,
    due: p.due, reps: p.reps, lapses: p.lapses, seen: p.seen,
    correct_count: p.correctCount, wrong_count: p.wrongCount, last_quality: p.lastQuality,
    updated_at: p.updatedAt || new Date().toISOString() };
}
async function pushProgress(id){
  if(!cloudReady() || !progress[id]) return;
  try{ await supa.from("aws_progress").upsert(progToRow(id)); }catch(e){}
}
async function pushProgressRows(ids){
  if(!cloudReady()) return;
  const rows = ids.filter(id => progress[id]).map(progToRow);
  if(rows.length){ const { error } = await supa.from("aws_progress").upsert(rows); if(error) throw error; }
}
async function pushAllProgress(){ await pushProgressRows(Object.keys(progress)); }
async function pushQuestions(arr){
  if(!cloudReady()) return;
  const rows = arr.filter(q=>q.id).map(q=>({ user_id: currentUser.id, id: q.id,
    domain: q.domain||null, section: q.section||null, type: q.type||null,
    question: q.question||null, choices: q.choices||null,
    answer: (q.answer===undefined?null:q.answer), explanation: q.explanation||null,
    keywords: q.keywords||null, updated_at: new Date().toISOString() }));
  if(rows.length){ const { error } = await supa.from("aws_questions").upsert(rows); if(error) throw error; }
}
/* 返り値: クラウドが持っているidの集合。syncAll がこれを使い、
   「クラウドにまだ無い問題」だけを押し上げる（全件upsertを避けるため）。 */
async function syncDownQuestions(){
  if(!cloudReady()) return null;
  const { data, error } = await supa.from("aws_questions").select("*");
  if(error) throw error;
  if(!data) return null;
  const cloudIds = new Set(data.map(r=>r.id));
  if(!data.length) return cloudIds; // クラウドに無ければローカル維持（空集合＝全件が押し上げ対象）
  const map = {}; questions.forEach(q=>map[q.id]=q);
  data.forEach(r=>{ map[r.id] = { id:r.id, domain:r.domain, section:r.section, type:r.type,
    question:r.question, choices:r.choices, answer:r.answer, explanation:r.explanation, keywords:r.keywords }; });
  questions = Object.values(map); saveQuestions();
  return cloudIds;
}
/* 返り値: question_id -> クラウド側の updated_at。syncAll がこれを使い、
   「クラウドより新しい／クラウドに無い」進捗だけを押し上げる。 */
async function syncDownProgress(){
  if(!cloudReady()) return null;
  const { data, error } = await supa.from("aws_progress").select("*");
  if(error) throw error;
  if(!data) return null;
  const cloudAt = {};
  data.forEach(r=>{
    cloudAt[r.question_id] = r.updated_at || "";
    const local = progress[r.question_id];
    const cloudT = r.updated_at || "";
    const localT = (local && local.updatedAt) || "";
    if(!local || cloudT > localT){
      progress[r.question_id] = { ef:r.ef, interval:r.interval, due:r.due, reps:r.reps,
        lapses:r.lapses, seen:r.seen, correctCount:r.correct_count, wrongCount:r.wrong_count,
        lastQuality:r.last_quality, updatedAt:r.updated_at };
    }
  });
  saveProgress();
  return cloudAt;
}
async function pushTerms(arr){
  if(!cloudReady()) return;
  const rows = (arr||[]).filter(t=>t.term).map(t=>({ user_id: currentUser.id, term: t.term,
    reading: t.reading||null, definition: t.definition||null, category: t.category||null,
    related: t.related||null, source: t.source||null, updated_at: new Date().toISOString() }));
  if(rows.length){ const { error } = await supa.from("aws_terms").upsert(rows); if(error) throw error; }
}
/* 返り値: クラウドが持っている用語名の集合（syncDownQuestions と同じ考え方）。 */
async function syncDownTerms(){
  if(!cloudReady()) return null;
  const { data, error } = await supa.from("aws_terms").select("*");
  if(error) throw error;
  if(!data) return null;
  const cloudTerms = new Set(data.map(r=>r.term));
  if(!data.length) return cloudTerms;
  const map = {}; terms.forEach(t=>map[t.term]=t);
  data.forEach(r=>{ map[r.term] = { term:r.term, reading:r.reading, definition:r.definition,
    category:r.category, related:r.related||[], source:r.source }; });
  terms = Object.values(map); saveTerms();
  return cloudTerms;
}
/* 押し上げるのは「クラウドにまだ無いもの」だけにする。
   以前は毎回 questions/terms を全件 upsert し返していて、その大半は
   直前に syncDown で受け取ったのと同じ内容の書き戻しだった（1回あたり約500KBの通信）。
   クラウド側が勝つ方針は変えていないので、見える動きは同じ。
   ※既存の問題文を「直す」のは npm run push（全件upsert）の役目で、ここは変わらない。 */
async function syncAll(){
  if(!cloudReady()) return;
  // 同期中に呼ばれたら、捨てずに「終わったらもう一度」を予約する。以前は黙って return して
  // いたため、起動直後に questions.json を取り込んでも先行の同期に飲まれて押し上げられなかった。
  if(syncing){ syncAgain = true; return; }
  if(navigator.onLine === false){ setSyncStatus("オフライン（電波がある時に同期します）"); return; }
  syncing = true; setSyncStatus("同期中…");
  try{
    const cloudQIds = await syncDownQuestions();          // 問題：クラウド→ローカル（増えた分を取得）
    const newQ = cloudQIds ? questions.filter(q=>q.id && !cloudQIds.has(q.id)) : [];
    if(newQ.length) await pushQuestions(newQ);            // 問題：この端末にしか無い分だけ押し上げ

    const cloudTerms = await syncDownTerms();             // 用語：クラウド→ローカル
    const newT = cloudTerms ? terms.filter(t=>t.term && !cloudTerms.has(t.term)) : [];
    if(newT.length) await pushTerms(newT);                // 用語：この端末にしか無い分だけ押し上げ

    const cloudPAt = await syncDownProgress();            // 進捗：新しい方を採用
    const staleP = cloudPAt ? Object.keys(progress).filter(id=>{
      const cloudT = cloudPAt[id];
      return cloudT === undefined || (progress[id].updatedAt || "") > cloudT;
    }) : [];
    if(staleP.length) await pushProgressRows(staleP);     // 進捗：クラウドより新しい分だけ押し上げ

    setSyncStatus("同期済み（問題 " + questions.length + " 問・用語 " + terms.length + " 語）");
  }catch(e){ setSyncStatus("同期エラー: " + (e.message || e.code || e)); }
  finally{ syncing = false; if(view==="settings"||view==="home"||view==="zukan") render(); }
  if(syncAgain){ syncAgain = false; await syncAll(); }   // 同期中に来ていた分をここで拾う
}

function prog(id){
  if(!progress[id]){
    progress[id] = {ef:2.5, interval:0, due:todayStr(), reps:0, lapses:0, seen:false, correctCount:0, wrongCount:0, lastQuality:null};
  }
  return progress[id];
}

/* ===== SM-2（忘却曲線） ===== */
// quality: 0〜5。正解=4以上、不正解=2 を基本にする。
function applySM2(id, quality){
  const p = prog(id);
  p.seen = true;
  p.lastQuality = quality;
  if(quality >= 3){
    p.correctCount++;
    if(p.reps === 0) p.interval = 1;
    else if(p.reps === 1) p.interval = 3;
    else p.interval = Math.round(p.interval * p.ef);
    p.reps++;
  } else {
    p.wrongCount++;
    p.lapses++;
    p.reps = 0;
    p.interval = 1;   // 間違いは翌日また出す
  }
  // ease factor 更新（最低1.3）
  p.ef = Math.max(1.3, p.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  p.due = addDays(todayStr(), p.interval);
  p.updatedAt = new Date().toISOString();   // 同期の新旧判定用
  saveProgress();
  pushProgress(id);   // ログイン中なら裏でクラウドへ（オフライン時は無視）
}

// 学習ストリーク：今日 or 昨日を起点に、学習した日が連続何日続いているか
function studyStreak(){
  const days = new Set();
  Object.values(progress).forEach(p=>{
    if(p && p.updatedAt) days.add(ymd(new Date(p.updatedAt)));
  });
  let cursor = todayStr();
  if(!days.has(cursor)) cursor = addDays(cursor, -1);   // 今日はまだやってなければ昨日から数える
  let n = 0;
  while(days.has(cursor)){ n++; cursor = addDays(cursor, -1); }
  return n;
}

/* 今日の出題対象：期限切れ(due<=今日) または 未学習 */
function dueQuestions(){
  const t = todayStr();
  return questions.filter(q => {
    const p = progress[q.id];
    if(!p) return true;            // 未学習
    return p.due <= t;             // 復習日が来ている
  });
}
function weakQuestions(){
  return questions.filter(q => {
    const p = progress[q.id];
    return p && (p.wrongCount > 0) ;
  }).sort((a,b)=>(progress[b.id].wrongCount)-(progress[a.id].wrongCount));
}

/* ===== セッション制御 ===== */
function startSession(pool, label, limit){
  if(pool.length === 0){ alert("対象の問題がありません。"); return; }
  // シャッフル
  let arr = [...pool];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  if(limit && limit > 0) arr = arr.slice(0, limit);   // 1回の出題数で区切る
  // 4択は出題のたびに選択肢をシャッフル（位置で暗記するのを防ぐ）。元データは変えずセッション用に複製。
  arr = arr.map(q=>{
    if(q.type==="choice" && Array.isArray(q.choices) && q.choices.length>1){
      const order = q.choices.map((_,i)=>i);
      for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
      return Object.assign({}, q, { choices: order.map(i=>q.choices[i]), answer: order.indexOf(q.answer) });
    }
    return q;
  });
  session = { queue: arr, idx:0, label, done:0, correct:0, answered:false };
  view = "quiz";
  render();
}

function answerChoice(qi){
  const q = session.queue[session.idx];
  if(session.answered) return;
  session.answered = true;
  session.picked = qi;
  const correct = qi === q.answer;
  if(correct) session.correct++;
  session.done++;
  applySM2(q.id, correct ? 5 : 2);
  // 間違えてもこのセッションでは繰り返さない（忘却曲線で翌日また出る）
  renderQuiz();
}

function gradeTerm(quality){ // 記述式：自己採点（◎=5, △=3, ✕=1）
  const q = session.queue[session.idx];
  if(session.answered) return;
  session.answered = true;
  session.termGrade = quality;
  session.done++;
  if(quality >= 4) session.correct++;
  applySM2(q.id, quality);
  // 自己採点が低くてもこのセッションでは繰り返さない（忘却曲線で翌日また出る）
  renderQuiz();
}

function nextQuestion(){
  session.idx++;
  session.answered = false;
  session.revealed = false;
  session.myAnswer = "";
  session.picked = null;
  session.termGrade = null;
  if(session.idx >= session.queue.length){ finishSession(); return; }   // 設定した問数でちょうど終了
  renderQuiz();
}

function quitSession(){
  // 途中でやめてもOK。各問の結果はすでに保存済み。
  if(session && session.done > 0){ finishSession(); }   // やった分の成績を表示
  else { session=null; view="home"; render(); }
}

function finishSession(){
  const acc = session.done ? Math.round(session.correct / session.done * 100) : 0;
  const html = `
    <div class="card center">
      <h2>おつかれさまでした 🎉</h2>
      <p class="big">${acc}%</p>
      <p class="muted">${session.correct} / ${session.done} 問正解</p>
      <p class="hint">間違えた問題は忘却曲線に沿って近いうちにまた出ます。</p>
      <button class="btn" onclick="view='home';session=null;render()">ホームに戻る</button>
    </div>`;
  session = null; view="home";
  $("#app").innerHTML = html;
  syncNav();
}

/* ===== 画面描画 ===== */
function render(){
  syncNav();
  $("#hdrSub").textContent = questions.length ? `全${questions.length}問` : "";
  // 問題が0でも、設定は開けるようにする。用語だけ入っている状態なら図鑑も見せる。
  const canShow = questions.length > 0 || view === "settings" || (view === "zukan" && terms.length > 0);
  if(!canShow){
    $("#app").innerHTML = emptyState();
    return;
  }
  if(view === "quiz" && !session){ view = "home"; }   // セッションが無い状態でクイズ画面を描かない
  if(view === "home") renderHome();
  else if(view === "quiz") renderQuiz();
  else if(view === "zukan") renderZukan();
  else if(view === "stats") renderStats();
  else if(view === "settings") renderSettings();
}

function emptyState(){
  return `<div class="card center">
    <h2>ようこそ</h2>
    <p class="muted">まだ問題が入っていません。<br>「設定」から問題データ（JSON）を読み込んでください。</p>
    <button class="btn" onclick="view='settings';render()">⚙️ 設定を開く</button>
  </div>`;
}

  const f = getFilter();
  const due = applyFilter(dueQuestions());
  const allPool = applyFilter(questions);
  const newCount = allPool.filter(q=>!progress[q.id]).length;

  const batch = getBatch();
  const willDo = (batch > 0) ? Math.min(batch, due.length) : due.length;
  const batchNote = (batch > 0 && due.length > batch)
    ? `<p class="hint">今回はこの中から ${willDo} 問（残りは次回）</p>` : "";

  // 分野しぼり込みセレクタ（SM-2はそのまま、母集団を絞るだけ）
  const groups = sectionGroups();
  const opts = [`<option value="">すべて（全${questions.length}問）</option>`]
    .concat(groups.map(g=>`<option value="${esc(g.key)}" ${g.key===f?"selected":""}>${esc(g.label)}（${g.n}問）</option>`))
    .join("");

    <div class="card">
      <label class="muted" for="secFilter" style="display:block;margin-bottom:6px">📂 分野でしぼる</label>
      <select id="secFilter" onchange="setFilter(this.value)">${opts}</select>
      ${f?`<p class="hint" style="margin-top:6px">いまは絞り込み中。復習タイミング（忘却曲線）はそのまま、この分野の中だけ出ます。</p>`:""}
    </div>`;

  const doneMsg = f
    ? `この分野で復習のタイミングが来た問題は今ありません。<br>下の「この分野をランダム」で先取り練習もできます。`
    : `復習のタイミングが来た問題はまたここに出ます。<br>もっとやりたいときは下の「全問ランダム」でどうぞ。`;
  const topCard = due.length ? `
    <div class="card center">
      <p class="muted">今日やるべき問題${f?"（絞り込み中）":""}</p>
      <p class="big">${due.length}<span style="font-size:18px"> 問</span></p>
      <p class="hint">未学習 ${newCount} 問 ／ 復習 ${due.length-newCount} 問</p>
      ${streakHtml}
      ${batchNote}
      <button class="btn" onclick='startSession(applyFilter(dueQuestions()),"今日の分",getBatch())'>▶ ${willDo}問 始める</button>
    </div>` : `
    <div class="card center">
      <p class="big" style="font-size:30px">今日の分は完了！🎉</p>
      <p class="hint">${doneMsg}</p>
      ${streakHtml}
    </div>`;
  $("#app").innerHTML = filterCard + topCard + `
    <div class="card">
      <h2>ほかの出題</h2>
      <button class="btn secondary" onclick='startSession(applyFilter(questions),${f?'"この分野"':'"全問"'})'>${f?`この分野をランダム（${allPool.length}問）`:`全${questions.length}問をランダム`}</button>
      <button class="btn secondary" onclick='startSession(applyFilter(weakQuestions()),"苦手だけ")' ${weak.length?'':'disabled'}>苦手な問題だけ（${weak.length}問）</button>
    </div>
    <p class="hint center">電車の中でもオフラインで動きます。解いた結果は端末に保存されます。</p>
  `;
}

function renderQuiz(){
  const q = session.queue[session.idx];
  const num = Math.min(session.idx+1, session.queue.length);
  let body = "";
  if(q.type === "term"){
    body = renderTerm(q);
  } else {
    body = renderChoice(q);
  }
  $("#app").innerHTML = `
    <div class="quit-row"><button class="quit-btn" onclick="quitSession()">やめる ✕</button></div>
    <div class="card">
      <div class="progress-dots">${esc(session.label)} ・ ${num} / ${session.queue.length} 問</div>
      <div>${(q.section?`<span class="tag">${esc(q.section)}</span>`:"")}${q.type==="term"?'<span class="tag">記述</span>':''}</div>
      ${renderHistoryBadge(q)}
      <h2 style="margin-top:8px">${esc(q.question)}</h2>
      ${body}
    </div>`;
}

// 出題前に「過去に出たか／いつ／正解だったか」を軽く表示する
function renderHistoryBadge(q){
  const p = progress[q.id];
  if(!p || !p.seen) return "";
  const when = daysAgoLabel(p.updatedAt);
  const ok = p.lastQuality != null && p.lastQuality >= 3;
  const resultLabel = ok ? "○正解" : "✕不正解";
  return `<p class="hint" style="margin-top:4px">🔁 ${when ? when+"に" : ""}出題済み（前回${resultLabel}・通算 ◯${p.correctCount} ✕${p.wrongCount}）</p>`;
}

function renderChoice(q){
  let html = "";
  q.choices.forEach((c,i)=>{
    let cls = "choice";
    let mark = "";
    if(session.answered){
      if(i === q.answer){ cls += " correct"; mark = '<span class="mark">○</span>'; }
      else if(i === session.picked){ cls += " wrong"; mark = '<span class="mark">×</span>'; }
    }
    html += `<button class="${cls}" onclick="answerChoice(${i})">${mark}${esc(c)}</button>`;
  });
  if(session.answered){
    const ok = session.picked === q.answer;
    html += `
      <div class="feedback ${ok?'ok':'ng'}">
        <h3>${ok?'正解 ◯':'不正解 ✕'}</h3>
        <div>${esc(q.explanation||"")}</div>
      </div>
      <button class="btn" onclick="nextQuestion()">次へ ▶</button>`;
  }
  return html;
}

function renderTerm(q){
  if(!session.revealed){
    return `
      <textarea id="termInput" rows="4" placeholder="用語の意味を自分の言葉で書いてみましょう"></textarea>
      <button class="btn" onclick="revealTerm()">答えを見る</button>
      <p class="hint">※書かずに頭で答えてから「答えを見る」でもOK</p>`;
  } else {
    const mine = session.myAnswer || "";
    const head = `
      ${mine?`<div class="feedback"><h3>あなたの答え</h3><div>${esc(mine)}</div></div>`:''}
      <div class="feedback ok"><h3>模範解答</h3><div>${esc(q.answer)}</div>
        ${q.explanation?`<p class="hint" style="margin-top:8px">${esc(q.explanation)}</p>`:''}</div>`;
    if(!session.answered){
      // 採点まち
      return head + `
        <p class="muted center" style="margin-top:10px">自己採点してください</p>
        <div class="row">
          <button class="btn" style="background:var(--ok);color:#fff" onclick="gradeTerm(5)">◎ 言えた</button>
          <button class="btn secondary" onclick="gradeTerm(3)">△ あいまい</button>
          <button class="btn" style="background:var(--ng);color:#fff" onclick="gradeTerm(1)">✕ ダメ</button>
        </div>`;
    } else {
      // 採点ずみ → 次へ
      const label = session.termGrade >= 4 ? "◎ 言えた" : (session.termGrade >= 3 ? "△ あいまい" : "✕ ダメ");
      return head + `
        <p class="muted center" style="margin-top:10px">自己採点：<b>${label}</b></p>
        <button class="btn" onclick="nextQuestion()">次へ ▶</button>`;
    }
  }
}
function revealTerm(){
  const el = document.getElementById("termInput");
  session.myAnswer = el ? el.value.trim() : "";
  session.revealed = true;   // 答えを表示（採点はまだ）
  renderQuiz();
}

function renderStats(){
  const total = questions.length;
  const seen = questions.filter(q=>progress[q.id]&&progress[q.id].seen).length;
  let cAll=0, wAll=0;
  questions.forEach(q=>{ const p=progress[q.id]; if(p){cAll+=p.correctCount; wAll+=p.wrongCount;} });
  const accAll = (cAll+wAll)? Math.round(cAll/(cAll+wAll)*100):0;

  // ドメイン別
  let domHtml = "";
  DOMAINS.forEach(dom=>{
    const qs = questions.filter(q=>q.domain===dom);
    if(qs.length===0) return;
    let c=0,w=0;
    qs.forEach(q=>{const p=progress[q.id]; if(p){c+=p.correctCount;w+=p.wrongCount;}});
    const acc=(c+w)?Math.round(c/(c+w)*100):0;
    domHtml += `<div class="stat-line"><span>${esc(dom)}</span><span>${(c+w)?acc+'%':'未'} <span class="hint">(${qs.length}問)</span></span></div>
      <div class="bar"><i style="width:${acc}%"></i></div>`;
  });

  // 間違い多い順
  const weak = weakQuestions().slice(0,8);
  let weakHtml = weak.length ? weak.map(q=>{
    const p=progress[q.id];
    return `<div class="list-item">✕${p.wrongCount}回 / ◯${p.correctCount}回　${esc(q.question)}</div>`;
  }).join("") : '<p class="hint">まだ間違えた問題はありません。</p>';

  // これからの復習予定
  const t=todayStr();
  const upcoming = {};
  questions.forEach(q=>{const p=progress[q.id]; if(p&&p.seen){ upcoming[p.due]=(upcoming[p.due]||0)+1; }});
  const upDates = Object.keys(upcoming).sort().slice(0,6);
  const upHtml = upDates.length ? upDates.map(d=>`<div class="stat-line"><span>${d===t?'今日':d}</span><span>${upcoming[d]}問</span></div>`).join("") : '<p class="hint">まだ予定はありません。</p>';

  $("#app").innerHTML = `
    <div class="card center">
      <p class="muted">全体の正答率</p>
      <p class="big">${accAll}%</p>
      <p class="hint">学習済 ${seen}/${total}問 ・ 累計 ◯${cAll} ✕${wAll}</p>
    </div>
    <div class="card"><h2>分野別の正答率</h2>${domHtml||'<p class="hint">データなし</p>'}</div>
    <div class="card"><h2>間違いが多い問題</h2>${weakHtml}</div>
    <div class="card"><h2>これからの復習予定</h2>${upHtml}</div>
  `;
}

/* ===== 図鑑（用語） ===== */
function openTerm(name){ zukanTerm = name; render(); }
function closeTerm(){ zukanTerm = null; render(); }
function questionsByTerm(name){
  return questions.filter(q => (q.keywords||[]).some(k => k.includes(name) || name.includes(k)) || (q.question||"").includes(name));
}
/* 検索の絞り込みは一覧部分だけ描き直す。
   以前は1文字ごとに画面全体を作り直して入力欄にフォーカスを当て直していたため、
   図鑑タブを開いただけでスマホのキーボードが勝手に開いてしまっていた。 */
function filterZukan(v){
  zukanQuery = v;
  const el = document.getElementById("zukanList");
  if(el) el.innerHTML = zukanListHtml();
}

function zukanListHtml(){
  const q = zukanQuery.trim().toLowerCase();
  const cats = {};
  terms.forEach(t=>{
    if(q){
      const hay = (t.term+" "+(t.reading||"")+" "+(t.definition||"")+" "+(t.category||"")).toLowerCase();
      if(!hay.includes(q)) return;
    }
    const c = t.category || "その他";
    (cats[c] = cats[c] || []).push(t);
  });
  const catNames = Object.keys(cats);
  if(catNames.length === 0){
    return `<div class="card"><p class="hint">${terms.length ? "該当する用語がありません。" : "まだ用語がありません。問題データを読み込むと増えます。"}</p></div>`;
  }
  let body = "";
  catNames.forEach(c=>{
    body += `<div class="card"><h2>${esc(c)} <span class="hint">(${cats[c].length})</span></h2>`;
    cats[c].forEach(t=>{
      body += `<div class="list-item" style="cursor:pointer" onclick="openTerm(${jsArg(t.term)})">
        <b>${esc(t.term)}</b>${t.reading?` <span class="hint">${esc(t.reading)}</span>`:""}</div>`;
    });
    body += `</div>`;
  });
  return body;
}

function renderZukan(){
  if(zukanTerm){ renderTermDetail(zukanTerm); return; }
  const catCount = new Set(terms.map(t=>t.category||"その他")).size;
  $("#app").innerHTML = `
    <div class="card center">
      <p class="muted">用語図鑑</p>
      <p class="big">${terms.length}<span style="font-size:18px"> 語</span></p>
      <p class="hint">カテゴリ ${catCount} ／ 教材を足すほど増えていきます</p>
      <input type="text" id="zukanSearch" placeholder="🔍 用語で検索" value="${esc(zukanQuery)}"
        oninput="filterZukan(this.value)">
    </div>
    <div id="zukanList">${zukanListHtml()}</div>`;
}

function renderTermDetail(name){
  const t = terms.find(x=>x.term===name);
  if(!t){ zukanTerm=null; renderZukan(); return; }
  const rel = questionsByTerm(name);
  const relLinks = (t.related||[]).filter(r=>terms.some(x=>x.term===r))
    .map(r=>`<button class="tag" style="cursor:pointer;border:none" onclick="openTerm(${jsArg(r)})">${esc(r)} ›</button>`).join(" ");
  $("#app").innerHTML = `
    <div class="quit-row"><button class="quit-btn" onclick="closeTerm()">← 図鑑にもどる</button></div>
    <div class="card">
      ${t.category?`<span class="tag">${esc(t.category)}</span>`:""}
      <h2 style="margin:8px 0 0">${esc(t.term)}</h2>
      ${t.reading?`<p class="hint" style="margin:2px 0 10px">${esc(t.reading)}</p>`:""}
      <p>${esc(t.definition||"")}</p>
      ${relLinks?`<p class="muted" style="margin:14px 0 6px">関連用語</p><div>${relLinks}</div>`:""}
      ${rel.length
        ? `<button class="btn" style="margin-top:16px" onclick="startSession(questionsByTerm(${jsArg(name)}), '用語: ' + ${jsArg(t.term)})">この用語の問題を解く（${rel.length}問）</button>`
        : `<p class="hint" style="margin-top:16px">この用語に関する問題はまだありません。</p>`}
    </div>`;
}

/* 「最新を取り込む」: 同梱questions.jsonの最新を取り込み（localhostで有効）、ログイン中ならクラウドへ反映 */
async function pullLatest(){
  setSyncStatus("取り込み中…");
  let sourceUpdatedAt = "";
  try{
    const r = await fetch("questions.json", {cache:"no-store"});
    if(!r.ok){ throw new Error("questions.json の取得に失敗（HTTP " + r.status + "）。localhost:4811でこのページを開いていますか？"); }
    const d = await r.json();
    sourceUpdatedAt = (d.meta && d.meta.updatedAt) || "";
    mergeData(d);
  }catch(e){
    setSyncStatus("");
    alert("取り込みエラー: " + (e.message || e));
    return;
  }
  if(cloudReady()){ await syncAll(); } else { setSyncStatus(""); render(); }
  alert("取り込み完了：問題 " + questions.length + " 問・用語 " + terms.length + " 語"
    + (sourceUpdatedAt ? "\n教材データの更新日: " + sourceUpdatedAt : "")
    + (cloudReady() ? "\nクラウドにも同期しました。他の端末は「今すぐ同期」で反映されます。" : "\n（ログインすると他の端末にも同期されます）"));
}

function renderSettings(){
  const batchOpts = [[5,"5問"],[10,"10問"],[20,"20問"],[0,"全部"]].map(([v,l])=>
    `<button class="btn ${getBatch()===v?'':'secondary'}" style="flex:1;min-width:68px" onclick="setBatch(${v})">${l}</button>`
  ).join("");
  let authCard;
  if(!supa){
    authCard = `<div class="card"><h2>アカウント（同期）</h2>
      <p class="hint">いまオフラインのため同期は使えません。電波がある時に開くとログインできます。</p></div>`;
  } else if(currentUser){
    authCard = `<div class="card"><h2>アカウント（同期）</h2>
      <p class="muted">${esc(currentUser.email||"ログイン中")}</p>
      <p class="hint" id="syncStatus">${esc(syncStatus||"同期済み")}</p>
      <button class="btn" onclick="pullLatest()">🔄 最新を取り込む</button>
      <button class="btn secondary" onclick="syncAll()">今すぐ同期</button>
      <button class="btn secondary" onclick="signOut()" style="color:var(--ng)">ログアウト</button>
      <p class="hint" style="margin-top:8px">「最新を取り込む」＝新しい問題・用語を取り込んでクラウドへ反映（PCで使用）。スマホは「今すぐ同期」だけでOK。</p>
    </div>`;
  } else {
    authCard = `<div class="card"><h2>アカウント（同期）</h2>
      <p class="muted">ログインすると、問題と学習記録がクラウドに保存されます。機種を変えても消えず、PCで増やした問題も自動で届きます。</p>
      <input type="email" id="authEmail" placeholder="メールアドレス" autocomplete="username">
      <input type="password" id="authPass" placeholder="パスワード（6文字以上）" autocomplete="current-password" style="margin-top:8px">
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="signIn()">ログイン</button>
        <button class="btn secondary" onclick="signUp()">新規登録</button>
      </div>
      <p class="hint" id="syncStatus">${esc(syncStatus)}</p>
    </div>`;
  }
  // 1回で組み立てて1回だけ差し込む（以前は += で二度組み立てていて、
  // 追記のたびに画面全体のDOMが作り直されていた）
  $("#app").innerHTML = authCard + `
    <div class="card">
      <h2>1回の出題数</h2>
      <p class="muted">「今日の分」を何問ずつ出すか。通勤時間に合わせて選べます。</p>
      <div class="row" style="flex-wrap:wrap">${batchOpts}</div>
    </div>
    <div class="card">
      <h2>問題データの読み込み</h2>
      <p class="muted">JSONファイルを選ぶか、内容を貼り付けて読み込みます。バックアップしたファイルもここから戻せます。</p>
      <input type="file" id="fileInput" accept=".json,application/json" style="margin:8px 0">
      <textarea id="pasteInput" rows="4" placeholder="ここにJSONを貼り付けてもOK"></textarea>
      <button class="btn" onclick="importPasted()">貼り付けたJSONを読み込む</button>
      <p class="hint">現在 問題${questions.length}問 / 用語${terms.length}語 を保持中。</p>
    </div>
    <div class="card">
      <h2>バックアップ</h2>
      <button class="btn secondary" onclick="exportProgress()">学習記録を書き出す（JSON）</button>
      <p class="hint">機種変更や万一に備えて。問題・用語・学習記録をまとめて出力し、上の「読み込み」からそのまま戻せます。</p>
    </div>
    <div class="card">
      <h2>リセット</h2>
      <button class="btn secondary" onclick="resetProgress()">学習記録だけ消す</button>
      <button class="btn secondary" onclick="resetAll()" style="color:var(--ng)">全部消す（問題も）</button>
    </div>
    <details><summary>このアプリについて</summary>
      <p>個人学習用。オフラインで動作し、データは端末内(localStorage)にのみ保存されます。
      忘却曲線はSM-2方式を簡略化して実装しています。</p>
    </details>
  `;
  document.getElementById("fileInput").addEventListener("change", e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=> doImport(r.result);
    r.readAsText(f);
  });
}

/* ===== インポート / エクスポート ===== */
async function doImport(text){
  let data, n;
  try{
    data = JSON.parse(text);
    n = mergeData(data);   // 問題・用語・（バックアップなら）学習記録をまとめて取り込む
    if(!n.q && !n.t && !n.p) throw new Error("問題・用語・学習記録のいずれも見つかりません");
  }catch(err){
    alert("読み込み失敗：" + err.message);
    return;
  }
  // ここまで来れば端末への取り込みは完了している。クラウドへの反映は必ず await して
  // 成否をそのまま伝える（待たずにalertを出していた頃は、pushが失敗しても
  // 画面には「クラウドにも同期しました」と表示されていた）。
  let cloudMsg = "";
  if(cloudReady()){
    try{
      if(n.q) await pushQuestions(data.questions || (Array.isArray(data) ? data : []));
      if(n.t) await pushTerms(data.terms);
      if(n.p) await pushAllProgress();
      cloudMsg = "\nクラウドにも同期しました。";
    }catch(e){
      cloudMsg = "\n※クラウドへの同期に失敗しました（端末には保存済み）：" + (e.message || e.code || e)
        + "\n電波のある場所で「今すぐ同期」を押してください。";
    }
  }
  const parts = [];
  if(n.q) parts.push(`問題${n.q}問`);
  if(n.t) parts.push(`用語${n.t}語`);
  if(n.p) parts.push(`学習記録${n.p}件`);
  alert(`読み込み成功：${parts.join("・")}を追加/更新しました`
    + `（合計 問題${questions.length} / 用語${terms.length}）。` + cloudMsg);
  view="home"; render();
}
function importPasted(){
  const t = document.getElementById("pasteInput").value.trim();
  if(!t){ alert("JSONを貼り付けてください。"); return; }
  doImport(t);
}
/* バックアップ書き出し。ここで出したファイルは、そのまま「問題データの読み込み」から
   読み戻せる形（questions / terms / progress）にしておく。 */
function exportProgress(){
  const payload = { questions, terms, progress, exportedAt:new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `aws-quiz-backup-${todayStr()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function resetProgress(){
  if(!confirm("学習記録（正答率・復習予定）を消します。問題データは残ります。よろしいですか？")) return;
  progress = {}; saveProgress();
  if(cloudReady()){ try{ await supa.from("aws_progress").delete().eq("user_id", currentUser.id); }catch(e){} }
  alert("学習記録を消しました。"); render();
}
async function resetAll(){
  if(!confirm("問題データも学習記録も全部消します。元に戻せません。よろしいですか？")) return;
  localStorage.removeItem(K_Q); localStorage.removeItem(K_P); localStorage.removeItem(K_TERMS);
  questions=[]; progress={}; terms=[];
  if(cloudReady()){
    try{ await supa.from("aws_progress").delete().eq("user_id", currentUser.id); }catch(e){}
    try{ await supa.from("aws_questions").delete().eq("user_id", currentUser.id); }catch(e){}
    try{ await supa.from("aws_terms").delete().eq("user_id", currentUser.id); }catch(e){}
  }
  alert("すべて消しました。"); view="settings"; render();
}

/* ===== ナビ ===== */
function syncNav(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === (view==="quiz"?"home":view));
  });
}
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click", ()=>{
    // クイズ中でも自由に移動OK（各問は回答時に保存済み）
    session=null; zukanTerm=null; view=b.dataset.view; render();
  });
});

/* ===== サービスワーカー登録（オフライン起動用） ===== */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ===== 認証状態の監視（ログインしていれば同期） ===== */
if(supa){
  supa.auth.onAuthStateChange((_event, sess)=>{
    currentUser = sess ? sess.user : null;
    if(currentUser){ syncAll(); }
    if(view==="settings") render();
  });
  // 起動時に既存セッションを確認（onAuthStateChangeでも拾えるが念のため）
  supa.auth.getSession().then(({ data })=>{
    if(data && data.session){ currentUser = data.session.user; syncAll(); }
  }).catch(()=>{});
  // 電波が戻ったら自動で同期
  window.addEventListener("online", ()=>{ if(cloudReady()) syncAll(); });
}

/* ===== 起動 ===== */
initTheme();
load();
render();
// 同梱のquestions.jsonがあれば「常に最新」を取り込む（localhost等で有効・配信版は404で無視）。
// 問題・用語をidでマージし、ログイン中ならクラウドへも反映（=新素材の取り込み口）。
fetch("questions.json", {cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
  mergeData(d);
  render();
  if(cloudReady()) syncAll();   // ログイン済みなら取り込んだ最新をクラウドへ
}).catch(()=>{});
</script>
